<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0E1210">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Moje Stavba</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hdr">
  <div class="hrow">
    <div class="logo brk" id="logo"><b>MOJE STAVBA</b><i>Postav si svět od nuly</i></div>
    <div class="lvlbox brk"><i>LVL</i><b id="lvl">1</b></div>
    <div class="xpbox brk"><div class="xptop"><span>XP</span><span id="xptxt">0 / 100</span></div>
      <div class="xpbar"><div class="xpfill" id="xpfill"></div></div></div>
    <div class="moneybox brk"><b id="money">0</b><span class="cur">&#164;</span></div>
    <div class="moneybox brk pw" id="pwbox" style="display:none"></div>
    <div class="moneybox brk pw wt" id="wbox" style="display:none"></div>
  </div>
  <div class="resrow" id="resrow"></div>
</div>

<div id="stage">
  <canvas id="cv"></canvas>
  <button class="fab" id="back">&#8592; MAPA</button>
  <button id="worldbtn" style="display:none">🚂<span>SVĚT</span></button>
  <div id="zoomwrap"><button id="zin">+</button><button id="zout">&#8722;</button></div>
  <div id="hintbar">Ťukni na stanici a spusť těžbu</div>
  <button class="fab" id="collectAll">SEBRAT VŠE</button>
  <div id="festbar"></div>
  <div id="seabar"></div>
  <div id="toast" class="on"></div>
  <div id="detail"><div class="db" id="detailBody"></div></div>
</div>

<div id="quest" class="brk">
  <div class="qi">!</div>
  <div class="qt"><b id="qTitle">&#8212;</b><i id="qDesc">&#8212;</i></div>
  <div class="qp" id="qProg"></div>
</div>

<nav id="nav">
  <button class="on" data-s="mapa"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.3 7-11a7 7 0 10-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>Mapa</button>
  <button data-s="stavby"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12M10 21v-6h4v6"/></svg>Stavby</button>
  <button data-s="zakazky"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM15 3v4h4M9 12h7M9 16h7"/></svg>Zakázky</button>
  <button data-s="vyroba"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21v-9l5 3V12l5 3V6l4 3v12"/></svg>Výroba</button>
  <button data-s="obchod"><svg viewBox="0 0 24 24"><path d="M4 4h16l-1.5 6H5.5zM6 10v10h12V10M9 20v-5h6v5"/></svg>Obchod</button>
  <button data-s="rozvoj"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Rozvoj</button>
</nav>

<div id="banner"><div class="bcard" id="bcard"></div></div>
<div id="sheet"><div id="sheetIn"><div class="grab"></div><div class="sb" id="sheetBody"></div></div></div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script src="state.js"></script>
<script src="render.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
<script src="dev.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (nw) nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) nw.postMessage('skipWaiting');
      });
    });
    reg.update();
  }).catch(()=>{});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (reloaded) return; reloaded = true; location.reload();
  });
}
</script>
</body>
</html>
